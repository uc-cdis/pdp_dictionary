$schema: "http://json-schema.org/draft-04/schema#"

id: "liquid_biopsy"
title: Liquid Biopsy
type: object
namespace: https://prometheus.data-commons.org/
category: biospecimen
program: '*'
project: '*'
description: >
  Pertaining to the study and analysis of liquid biopsies.
additionalProperties: false
submittable: true
validators: []

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

required:
  - type
  - submitter_id
  - samples

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

links:
  - name: samples
    backref: liquid_biopsies
    label: derived_from
    multiplicity: many_to_one
    target_type: sample
    required: true

constraints: null

# Aliquot properties
properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  results_file:
    description: >
      The file containing results for the subject-metabolite combination.
    type: string

  data_type:
    description: >
      The type of file for the subject-metabolite combination.
    enum:
      - ALT
      - AMB
      - ANN
      - AVRO
      - BCF
      - BED
      - BNP
      - BWT
      - C
      - CSI
      - CSV
      - CTR
      - DAT
      - DB
      - DCM
      - DESC
      - DOC
      - DOCX
      - DTA
      - FAI
      - FASTA
      - FMT
      - FOR
      - GDS
      - GRD
      - GZ
      - JSON
      - MD
      - PAC
      - PDF
      - POS
      - PPT
      - R
      - RDATA
      - RTF
      - SA
      - SAS
      - SAS7BCAT
      - SAS7BDAT
      - SAV
      - STM
      - TAR
      - TBI
      - TBL
      - TSV
      - TXT
      - VCF
      - WPD
      - XLS
      - XLSX
      - XML
      - ZIP

  guid:
    description: >
      The Globally Unique Identifier (GUID) of file for the subject-metabolite combination.
    type: string

  samples:
    $ref: "_definitions.yaml#/to_one"
