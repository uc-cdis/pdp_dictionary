$schema: "http://json-schema.org/draft-04/schema#"

id: "study"
title: Study
type: object
namespace: https://prometheus.data-commons.org/
category: administrative
program: '*'
project: '*'
description: >
  A coordinated set of actions and observations designed to generate data, with the ultimate goal
  of discovery or hypothesis testing.
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state

links:
  - name: projects
    backref: studies
    label: performed_for
    target_type: project
    multiplicity: many_to_one
    required: true

required:
  - type
  - submitter_id
  - projects

uniqueKeys:
  - [ id ]
  - [ project_id, submitter_id ]

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  prometheus_study_id:
    description: The Prometheus Study Identifier for this study.
    type: string

  project_number:
    description: The project number for this study.
    type: string

  institution:
    description: The name of the affiliated institution.
    type: string

  principal_investigator:
    description: The name of the principal investigator.
    type: string

  investigators:
    description: The names of the investigators.
    type: array
    items:
      type: string

  study_description:
    description: "A brief description of the study being performed. Free text"
    type: string

  data_description:
    description: "Brief description of the data being provided for this study. Free text"
    type: string

  study_type:
    description: The type of study from controlled vocabulary.
    type: string

  subject_type:
    description: The type of subjects from controlled vocabulary.
    type: string

  research_program:
    description: The research program associated with the study.
    type: string

  research_focus_area:
    description: The research focus area for the study.
    type: string

  version:
    description: The current study version in the data commons.
    type: string

  last_updated:
    $ref: "_definitions.yaml#/datetime"

  access_type:
    description: The type of access for this study.
    type: string

  accural_status:
    description: The accrual status of the study.
    type: string

  hosted_commons:
    description: The data commons and environments where the study data is hosted.
    type: array
    items:
      type: string

  geographical_region:
    description: The geographical regions associated with the study.
    type: array
    items:
      type: string

  military_population:
    description: The military population of the study.
    type: string

  study_registration:
    description: >
      External source from which the identifier included in study_id originates.
    type: string

  study_id:
    description: >
      Unique identifier that can be used to retrieve more information for a study.
    type: string

  dbgap_accession:
    description: >
      The dbgap accession number provided for the project (example, phs123456.v1.p1.c1).
    type: string

  authz:
    description: >
      The authz string (example, ["/programs/Program.name/projects/Project.code"] ).
    type: array
    items:
      type: string

  short_name:
    description: >
      The shorthand name for the project.
    type: string

  full_name:
    description: >
      The full name for the project.
    type: string

  complete:
    description: >
      Description of whether the project submission is complete or still in progress.
    enum:
      - "Complete"
      - "Incomplete"

  projects:
    $ref: "_definitions.yaml#/to_one_project"
