$schema: "http://json-schema.org/draft-04/schema#"

id: "medical_record"
title: Medical Record
type: object
namespace: https://prometheus.data-commons.org/
category: clinical
program: '*'
project: '*'
description: >
  Standard questionnaire used to collect medical records from the subject
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

links:
  - name: subjects
    backref: medical_records
    label: describes
    target_type: subject
    multiplicity: one_to_one
    required: true

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

required:
  - submitter_id
  - type
  - subjects

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  primary_disease:
    description: >
      The primary disease of the subject.
    type: string

  cancer_type:
    description: >
      The cancer type of the subject.
    type: string

  metastasis:
    description: >
      Has the cancer metastasized? (Yes/No)
    type: boolean

  cancer_grade:
    description: >
      The cancer grade of the subject.
    enum:
      - "Grade I"
      - "Grade II"
      - "Grade III"
      - "Grade IV"
      - "Unknown"

  cancer_stage:
    description: >
      The cancer stage of the subject.
    enum:
      - "Stage 0"
      - "Stage I"
      - "Stage II"
      - "Stage III"
      - "Stage IV"
      - "Unknown"

  subjects:
    $ref: "_definitions.yaml#/to_one"
