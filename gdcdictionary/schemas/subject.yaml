$schema: "http://json-schema.org/draft-04/schema#"

id: "subject"
title: Subject
type: object
nodeTerms: null
namespace: https://prometheus.data-commons.org/
category: administrative
program: '*'
project: '*'
description: The collection of all data related to a specific patient, case, or subject in the context of a specific dataset or experiment.
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

links:
  - name: studies
    backref: subjects
    label: member_of
    target_type: study
    multiplicity: many_to_many
    required: false

required:
  - submitter_id
  - type

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:

  $ref: "_definitions.yaml#/ubiquitous_properties"

  age_at_index:
    description: The study participant's age, in years, at the index event. The index event is determined by the data submitter and used as an anchor date for all temporal variables. Note that an age of 0 indicates a participant who is younger than 1 year old. For participants with ages greater than 89 years, please use the property 'age_at_index_gt89'.
    type: number
    maximum: 89
    minimum: 0

  age_at_index_gt89:
    description: Indicates whether the subject's age at the time of the study was greater than 89 years.
    enum:
      - "Yes"
      - "No"

  consent_codes:
    description: >
        Data Use Restrictions that are used to indicate  permissions/restrictions for datasets and/or materials, and relates to the purposes for which datasets and/or material might be removed, stored or used. \n
        Based on the Data Use Ontology : see http://www.obofoundry.org/ontology/duo.html \n
        GRU - For general research use for any research purpose. Example of usage: This includes but is not limited to: health/medical/biomedical purposes, fundamental biology research, the study of population origins or ancestry, statistical methods and algorithms development, and social-sciences research. \n
        HMB - Use of the data is limited to health/medical/biomedical purposes; does not include the study of population origins or ancestry. \n
        DS-X - Use of the data must be related to [disease]. \n
        NPU - Use of the data is limited to not-for-profit organizations and not-for-profit use, non-commercial use. \n
        IRB - Requestor must provide documentation of local IRB/REC approval.
    type: array
    items:
      type: string

  ethnicity:
    description: >
      The ethnicity of the subject.
    enum:
      - "Hispanic or Latino"
      - "Not Hispanic or Latino"
      - "Unknown"
      - "Declined to Answer"

  gender:
    term:
      $ref: "_terms.yaml#/gender"
    type: string

  biological_sex:
    description: >
      The biological sex of the subject.
    enum:
      - "Male"
      - "Female"
      - "Unknown"
      - "Not Reported"

  year_born:
    description: >
      The year of birth of the subject.
    type: integer

  race:
    term:
      $ref: "_terms.yaml#/race"
    type: string

  subject_id:
    description: >
      An additional identifier for the subject.
    type: string

  prometheus_global_id:
    description: >
      The Prometheus Global Identifier for the subject.
    type: string

  apollo_id:
    description: >
      The Apollo Identifier for the subject.
    type: string

  results_type:
    description: >
      The type of results for this subject (example, ["metabolomic"]).
    type: array
    items:
      type: string

  studies:
    description: The submitter_id or id of the study this subject belongs to, i.e., a link to a record in the parent node.
    $ref: "_definitions.yaml#/to_many"
