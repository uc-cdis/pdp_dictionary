$schema: "http://json-schema.org/draft-04/schema#"

id: "subject"
title: Subject
type: object
nodeTerms: null
namespace: https://prometheus.data-commons.org/
category: administrative
program: '*'
project: '*'
description: The collection of all data related to a specific patient, case, or subject in the context of a specific dataset or experiment.
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

links:
  - name: projects
    backref: subjects
    label: member_of
    target_type: project
    multiplicity: many_to_one
    required: true

required:
  - submitter_id
  - type
  - data_source_primary_subject_id

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  availabilty_type:
    description: >
      Access level for this subject's data.
    enum:
      - Open
      - Registered
      - Controlled

  data_source_primary_subject_id:
    description: >
      Unique identifier for the subject assigned by the data source.
    type: string

  data_source_secondary_subject_ids:
    description: >
      Unique identifier for the subject assigned by the data source.
    type: array
    items:
      type: string

  mc2dp_global_id:
    description: >
      System-generated global ID assigned by MC2DP upon ingestion. It is populated only when data is aggregated into MC2DP, not within Mini Commons itself
    type: string

  projects:
    description: The code of the project that this subject belongs to, i.e., a link to the parent node.
    $ref: "_definitions.yaml#/to_one_project"
