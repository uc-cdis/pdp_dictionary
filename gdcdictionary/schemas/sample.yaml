$schema: "http://json-schema.org/draft-04/schema#"

id: "sample"
title: Sample
type: object
namespace: https://prometheus.data-commons.org/
category: biospecimen
program: '*'
project: '*'
description: >
  Any biological or material sample used for testing, diagnostic, propagation, treatment
  or research purposes, including a sample obtained from a living organism or taken from the
  biological object after halting of all its life functions.
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

required:
  - type
  - submitter_id
  - subjects

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

links:
  - name: subjects
    backref: samples
    label: derived_from
    target_type: subject
    multiplicity: many_to_one
    required: true

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  biospecimen_anatomic_site:
    term:
      $ref: "_terms.yaml#/biospecimen_anatomic_site"
    type: string

  biospecimen_anatomic_site_detail:
    description: >
      Tissue type, more specific detail of tissue type.
    type: string

  biospecimen_anatomic_site_uberon_id:
    description: >
      Uberon ID, anatomical location as described by the Uber Anatomy Ontology (UBERON)
    type: string

  biospecimen_anatomic_site_uberon_term:
    description: >
      Uberon Term, anatomical location as described by the Uber Anatomy Ontology (UBERON)
    type: string

  sample_type:
    description: >
      Original material type of the collected sample
    type: string

  tissue_type:
    term:
      $ref: "_terms.yaml#/tissue_type"
    type: string

  specimen_id:
    description: >
      Unique identifier that can be used to retrieve more information for a specimen.
    type: string

  subjects:
    $ref: "_definitions.yaml#/to_one"
